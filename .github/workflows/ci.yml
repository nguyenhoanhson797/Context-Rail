name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .[test]
      - name: Default lane
        run: python -m pytest -q -m "not slow and not perf"
      - name: Speed budgets
        # One process, so the readings are comparable.
        run: python -m pytest -q -m "perf and not slow" -p no:xdist
      - name: Slow lane
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        run: python -m pytest -q -m slow -p no:xdist
