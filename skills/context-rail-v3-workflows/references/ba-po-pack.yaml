# A complete, tested v4 example pack: one status dictionary, three workflows.
#
# Copy it to <store>/packs/scrum-ba/pack.yaml, then:
#   rail ops pack validate --name scrum-ba
#   rail --actor human ops pack use --name scrum-ba --expect <rail.yaml etag> \
#                 --confirm "USE PACK scrum-ba"
#
# The manifest places these presets by default, so a store-local pack must
# declare them or the next write fails with "undeclared preset(s)":
#   decision, charter, goal, vision, scope, wont, skill, cto, profile
#
# What this example shows:
#   - `statuses` is one pack-wide dictionary; a status name has one category.
#   - `workflows` are named lifecycles; the top-level lifecycle is `default`.
#   - every item preset selects one workflow and declares `container`.
#   - a workflow maps a target status to a charter gate and the checks it selects.
#   - `actions` are declarative verbs over one allowlisted gateway tool.

name: scrum-ba
version: 1

statuses:
  intake: not_started
  ba_review: not_started
  po_review: not_started
  ready: not_started
  doing: active
  review: active
  blocked: blocked
  done: done
  dropped: dropped
  reported: not_started
  fixing: active
  verifying: active
  closed: done

# The `default` workflow, kept for any preset that selects nothing.
initial: intake
transitions:
  intake: [ba_review, dropped]
  ba_review: [po_review, intake, dropped]
  po_review: [ready, ba_review, dropped]
  ready: [doing, po_review, dropped]
  doing: [review, blocked, done, ready, dropped]
  review: [doing, blocked, done, dropped]
  blocked: [doing, review, dropped]
  done: [doing]
  dropped: [intake]
  reported: [fixing, closed]
  fixing: [verifying, reported, blocked]
  verifying: [closed, fixing]
  closed: [fixing]
execution:
  review: {dispatch: false}

workflows:
  # A story is accepted by the BA, then the PO, before it may start.
  story:
    initial: intake
    transitions:
      intake: [ba_review, dropped]
      ba_review: [po_review, intake, dropped]
      po_review: [ready, ba_review, dropped]
      ready: [doing, po_review, dropped]
      doing: [review, blocked, done, ready, dropped]
      review: [doing, blocked, done, dropped]
      blocked: [doing, review, dropped]
      done: [doing]
      dropped: [intake]
    execution:
      review: {dispatch: false}
    quality:
      done: {gate: item_done}
  # The analysis pack itself: two review steps, then a proof-bearing sign-off.
  ba:
    initial: intake
    transitions:
      intake: [ba_review, dropped]
      ba_review: [po_review, intake, dropped]
      po_review: [done, ba_review, dropped]
      done: []
      dropped: [intake]
    quality:
      done: {gate: item_done, checks: [po-acceptance]}
  # A defect has its own vocabulary and its own proof bar.
  bugfix:
    initial: reported
    transitions:
      reported: [fixing, closed]
      fixing: [verifying, reported, blocked]
      verifying: [closed, fixing]
      blocked: [fixing]
      closed: [fixing]
    execution:
      verifying: {dispatch: false}
    quality:
      closed: {gate: item_done, checks: [repro-check]}

presets:
  goal:       {primitive: item, tags: [goal], container: true, workflow: story}
  scope:      {primitive: item, tags: [scope], container: true, workflow: story,
               fields: {priority: [must, should, could, wont]}}
  epic:       {primitive: item, tags: [epic], container: true, workflow: story}
  story:      {primitive: item, tags: [story], container: false, workflow: story,
               fields: {priority: [must, should, could]},
               required: [estimate], defaults: {estimate: "3"}}
  task:       {primitive: item, tags: [task], container: false, workflow: story}
  ba_pack:    {primitive: item, tags: [ba], container: false, workflow: ba,
               fields: {depth: [light, full]}}
  po_signoff: {primitive: item, tags: [po], container: false, workflow: ba}
  bug:        {primitive: item, tags: [bug], container: false, workflow: bugfix}
  fix:        {primitive: item, tags: [], container: false, workflow: bugfix}
  risk:       {primitive: item, tags: [risk], container: false, workflow: story,
               fields: {severity: [low, medium, high, critical]}}
  question:   {primitive: item, tags: [question], container: false, workflow: story}
  note:       {primitive: note, tags: []}
  convention: {primitive: note, tags: [convention]}
  code:       {primitive: note, tags: [code],
               fields: {kind: [file, module, class, function, method]}}
  decision:   {primitive: record, tags: [decision]}
  event:      {primitive: record, tags: [event]}
  check:      {primitive: check, tags: []}
  charter:    {primitive: policy, tags: []}
  vision:     {primitive: note, tags: []}
  wont:       {primitive: note, tags: []}
  skill:      {primitive: note, tags: []}
  cto:        {primitive: actor, tags: []}
  profile:    {primitive: actor, tags: []}

policy: {stuck_hours: 24, retries: 1, measurement_min_runs: 10}

actions:
  send-to-ba:
    "on": story
    from: [intake]
    tool: change move
    args: {slug: "{item}", status: ba_review, expect: "{etag}"}
    use_when: "a story is ready for analysis"
  send-to-po:
    "on": story
    from: [ba_review]
    tool: change move
    args: {slug: "{item}", status: po_review, expect: "{etag}"}
    use_when: "the BA analysis is complete and the PO must accept it"
  accept-po:
    "on": story
    from: [po_review]
    tool: change move
    args: {slug: "{item}", status: ready, expect: "{etag}"}
    use_when: "the PO accepted the story, so it is ready to schedule"
  start-story:
    "on": story
    from: [ready]
    tool: change move
    args: {slug: "{item}", status: doing, expect: "{etag}"}
    requires: {field: estimate}
    use_when: "the story is accepted and estimated, so work may start"
  close-epic:
    "on": epic
    from: [doing]
    tool: change move
    args: {slug: "{item}", status: done, expect: "{etag}"}
    requires: {children: true}
    use_when: "every story in the epic is finished"
  file-bug:
    "on": "*"
    from: []
    tool: change add
    args: {preset: bug, title: "{title}", rel: ["part_of={parent}"]}
    use_when: "a defect needs recording before it is fixed"
  triage-report:
    "on": "*"
    from: []
    tool: loop triage
    args: {report: "{report}"}
    use_when: "one untriaged report needs a decision or a fix"
