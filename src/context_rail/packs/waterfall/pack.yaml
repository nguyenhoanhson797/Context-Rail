name: waterfall
version: 2
statuses: {planned: not_started, designing: active, building: active, testing: active, blocked: blocked, done: done, dropped: dropped}
initial: planned
transitions:
  planned: [designing, dropped]
  designing: [building, planned, dropped]
  building: [testing, blocked, dropped]
  testing: [done, building, blocked, dropped]
  blocked: [building, testing, dropped]
  done: [building]
  dropped: [planned]
workflows:
  phase:
    initial: planned
    transitions:
      planned: [designing, dropped]
      designing: [building, planned, dropped]
      building: [testing, blocked, dropped]
      testing: [done, building, blocked, dropped]
      blocked: [building, testing, dropped]
      done: [building]
      dropped: [planned]
    quality:
      done: {gate: item_done}
  delivery:
    initial: planned
    transitions:
      planned: [designing, dropped]
      designing: [building, planned, dropped]
      building: [testing, blocked, dropped]
      testing: [done, building, blocked, dropped]
      blocked: [building, testing, dropped]
      done: [building]
      dropped: [planned]
    quality:
      done: {gate: item_done}
presets:
  goal:        {primitive: item,   tags: [goal], container: true}
  scope:       {primitive: item,   tags: [scope], container: true, fields: {priority: [must, should, could, wont]}}
  requirement: {primitive: item,   tags: [requirement], container: false}
  phase:       {primitive: item,   tags: [phase], container: true, workflow: phase}
  deliverable: {primitive: item,   tags: [deliverable], container: false, workflow: delivery, template: templates/deliverable.md}
  task:        {primitive: item,   tags: [task], container: false, workflow: delivery}
  bug:         {primitive: item,   tags: [bug], container: false, workflow: delivery}
  milestone:   {primitive: item,   tags: [milestone], container: true}
  risk:        {primitive: item,   tags: [risk], container: false, fields: {severity: [low, medium, high, critical]}}
  question:    {primitive: item,   tags: [question], container: false}
  note:        {primitive: note,   tags: []}
  convention:  {primitive: note,   tags: [convention]}
  code:        {primitive: note,   tags: [code], fields: {kind: [file, module, class, function, method]}, template: templates/code.md}
  decision:    {primitive: record, tags: [decision]}
  event:       {primitive: record, tags: [event]}
  check:       {primitive: check,  tags: []}
  charter:     {primitive: policy, tags: [], template: templates/charter.md}
  vision:      {primitive: note,   tags: []}
  wont:        {primitive: note,   tags: []}
  skill:       {primitive: note,   tags: []}
  cto:         {primitive: actor,  tags: []}
  profile:     {primitive: actor,  tags: []}
  fix:         {primitive: item,   tags: [], container: false}
policy: {stuck_hours: 24, retries: 1, measurement_min_runs: 10}
operating:
  version: 1
  unit: deliverable
  hierarchy:
    - preset: phase
      order: sequence
      required: true
  focus:
    preset: phase
    category: active
    order: sequence
    resolve: unique
  queue:
    presets: [deliverable, task, bug]
    require: transition
    focus: priority
  progress:
    group: phase
    of: [deliverable]
    complete: {category: done}
actions:
  start-phase:
    "on": phase
    from: [planned]
    tool: change move
    args: {slug: "{item}", status: designing, expect: "{etag}"}
    use_when: "a phase is ready to start"
  complete-phase:
    "on": phase
    from: [testing]
    tool: change move
    args: {slug: "{item}", status: done, expect: "{etag}"}
    requires: {children: true}
    use_when: "every deliverable in the phase is finished"
