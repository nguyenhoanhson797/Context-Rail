version: 1
labels:
  phase: {one: Phase, many: Phases}
  deliverable: {one: Deliverable, many: Deliverables}
  requirement: {one: Requirement, many: Requirements}
  milestone: {one: Milestone, many: Milestones}
  task: {one: Task, many: Tasks}
  risk: {one: Risk, many: Risks}
screens:
  - {id: summary, kind: summary, title: Summary}
  - {id: board, kind: board, title: Deliverables, preset: deliverable, group_by: status}
  - {id: plan, kind: timeline, title: Phases, preset: phase}
  - {id: workflow, kind: workflow, title: Workflow}
  - {id: execution, kind: execution, title: Progress}
  - {id: catalog, kind: catalog, title: Requirements, presets: [requirement, task]}
