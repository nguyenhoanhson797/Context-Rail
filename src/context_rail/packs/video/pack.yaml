name: video
version: 2
statuses:
  draft: not_started
  ready: not_started
  storyboard: active
  generating: active
  review: active
  approved: done
  published: done
  queued: not_started
  running: active
  succeeded: done
  failed: blocked
  blocked: blocked
  dropped: dropped
initial: draft
transitions:
  draft: [ready, storyboard, queued, dropped]
  ready: [storyboard, draft, dropped]
  storyboard: [generating, review, blocked, dropped]
  generating: [review, blocked, dropped]
  review: [approved, generating, blocked, dropped]
  approved: [published, generating]
  published: [generating]
  queued: [running, dropped]
  running: [succeeded, failed, dropped]
  succeeded: [queued]
  failed: [queued]
  blocked: [storyboard, generating, review, dropped]
  dropped: [draft]
execution:
  review: {dispatch: false}
workflows:
  scene:
    initial: draft
    transitions:
      draft: [storyboard, dropped]
      storyboard: [generating, review, blocked, dropped]
      generating: [review, blocked, dropped]
      review: [approved, blocked, dropped]
      approved: [published]
      published: []
      blocked: [storyboard, generating, review, dropped]
      dropped: [draft]
    quality:
      approved: {gate: item_done}
  shot:
    initial: draft
    transitions:
      draft: [storyboard, dropped]
      storyboard: [generating, draft, dropped]
      generating: [review, blocked, dropped]
      review: [approved, generating, blocked, dropped]
      approved: [published, generating]
      published: [generating]
      blocked: [generating, review, dropped]
      dropped: [draft]
    quality:
      approved: {gate: item_done}
  asset:
    initial: draft
    transitions:
      draft: [ready, dropped]
      ready: [approved, dropped]
      approved: [ready]
      dropped: [draft]
  render:
    initial: queued
    transitions:
      queued: [running, dropped]
      running: [succeeded, failed, dropped]
      succeeded: []
      failed: [queued]
      dropped: [queued]
presets:
  goal:       {primitive: item,   tags: [goal], container: true}
  scope:      {primitive: item,   tags: [scope], container: true, fields: {priority: [must, should, could, wont]}}
  scene:      {primitive: item,   tags: [scene], container: true, workflow: scene, template: templates/scene.md}
  shot:       {primitive: item,   tags: [shot], container: false, workflow: shot, fields: {model: [standard, hero], duration: [short, long]}, template: templates/shot.md}
  asset:      {primitive: item,   tags: [asset], container: false, workflow: asset}
  render:     {primitive: item,   tags: [render], container: false, workflow: render}
  requirement: {primitive: item,  tags: [requirement], container: false}
  task:       {primitive: item,   tags: [task], container: false}
  bug:        {primitive: item,   tags: [bug], container: false}
  risk:       {primitive: item,   tags: [risk], container: false, fields: {severity: [low, medium, high, critical]}}
  question:   {primitive: item,   tags: [question], container: false}
  note:       {primitive: note,   tags: []}
  convention: {primitive: note,   tags: [convention]}
  code:       {primitive: note,   tags: [code], fields: {kind: [file, module, class, function, method]}, template: templates/code.md}
  decision:   {primitive: record, tags: [decision]}
  review:     {primitive: record, tags: [review]}
  event:      {primitive: record, tags: [event]}
  check:      {primitive: check,  tags: []}
  charter:    {primitive: policy, tags: [], template: templates/charter.md}
  vision:     {primitive: note,   tags: []}
  wont:       {primitive: note,   tags: []}
  skill:      {primitive: note,   tags: []}
  cto:        {primitive: actor,  tags: []}
  profile:    {primitive: actor,  tags: []}
  fix:        {primitive: item,   tags: [], container: false}
policy: {stuck_hours: 24, retries: 1, measurement_min_runs: 10}
operating:
  version: 1
  unit: shot
  hierarchy:
    - preset: scene
      order: sequence
      required: true
  focus:
    preset: scene
    category: active
    order: sequence
    resolve: unique
  queue:
    presets: [shot]
    require: transition
    focus: priority
  progress:
    group: scene
    of: [shot]
    complete:
      states: [approved]
  execution:
    actions: [render]
actions:
  start-scene:
    "on": scene
    from: [draft]
    tool: change move
    args: {slug: "{item}", status: storyboard, expect: "{etag}"}
    use_when: "a scene is ready to work on"
  storyboard:
    "on": shot
    from: [draft]
    tool: change move
    args: {slug: "{item}", status: storyboard, expect: "{etag}"}
    use_when: "a shot needs a storyboard before generation"
  generate:
    "on": shot
    from: [storyboard]
    tool: change move
    args: {slug: "{item}", status: generating, expect: "{etag}"}
    use_when: "a storyboarded shot is ready to generate"
  approve:
    "on": shot
    from: [review]
    tool: change move
    args: {slug: "{item}", status: approved, expect: "{etag}"}
    use_when: "a reviewed shot is accepted"
  publish:
    "on": shot
    from: [approved]
    tool: change move
    args: {slug: "{item}", status: published, expect: "{etag}"}
    use_when: "an approved shot is released"
  render:
    "on": shot
    from: [approved]
    tool: next
    args: {}
    use_when: "an approved shot is ready to render"
    version: 1
