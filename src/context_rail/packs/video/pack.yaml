name: video
version: 2
statuses:
  draft: not_started
  ready: not_started
  storyboard: active
  generating: active
  doing: active
  review: active
  approved: done
  published: done
  done: done
  blocked: blocked
  dropped: dropped
initial: draft
transitions:
  draft: [doing, dropped]
  doing: [review, blocked, dropped]
  review: [done, doing, blocked, dropped]
  done: [doing]
  blocked: [doing, dropped]
  dropped: [draft]
execution:
  review: {queue: false}
workflows:
  scene:
    initial: draft
    transitions:
      draft: [storyboard, dropped]
      storyboard: [generating, review, blocked, dropped]
      generating: [review, blocked, dropped]
      review: [approved, generating, blocked, dropped]
      approved: [published]
      published: []
      blocked: [storyboard, generating, review, dropped]
      dropped: [draft]
    execution:
      review: {queue: false}
    quality:
      approved: {gate: item_done}
    results:
      produce:
        preset: scene-result
        sections: [Summary, Creative intent, Shot coverage, Continuity, Evidence, Next steps]
      review:
        preset: scene-review
        sections: [Summary, Creative intent, Shot coverage, Continuity, Evidence, Verdict]
  shot:
    initial: draft
    transitions:
      draft: [storyboard, dropped]
      storyboard: [generating, draft, dropped]
      generating: [review, blocked, dropped]
      review: [approved, generating, blocked, dropped]
      approved: [published, generating]
      published: [generating]
      blocked: [generating, review, dropped]
      dropped: [draft]
    execution:
      review: {queue: false}
    quality:
      approved: {gate: item_done}
    results:
      produce:
        preset: shot-result
        sections: [Summary, Creative intent, Outputs and assets, Continuity, Evidence, Next steps]
      review:
        preset: shot-review
        sections: [Summary, Creative intent, Outputs and assets, Continuity, Evidence, Verdict]
  asset:
    initial: draft
    transitions:
      draft: [ready, dropped]
      ready: [approved, dropped]
      approved: [ready]
      dropped: [draft]
    results:
      produce:
        preset: asset-result
        sections: [Summary, Asset outputs, Reuse and rights, Continuity, Evidence, Next steps]
      review:
        preset: asset-review
        sections: [Summary, Asset outputs, Reuse and rights, Continuity, Evidence, Verdict]
presets:
  goal:       {primitive: item,   tags: [goal], container: true}
  scope:      {primitive: item,   tags: [scope], container: true, fields: {priority: [must, should, could, wont]}}
  scene:      {primitive: item,   tags: [scene], container: true, workflow: scene, template: templates/scene.md}
  shot:       {primitive: item,   tags: [shot], container: false, workflow: shot, fields: {model: [standard, hero], duration: [short, long]}, template: templates/shot.md}
  asset:      {primitive: item,   tags: [asset], container: false, workflow: asset}
  task:       {primitive: item,   tags: [task], container: false}
  bug:        {primitive: item,   tags: [bug], container: false}
  risk:       {primitive: item,   tags: [risk], container: false, fields: {severity: [low, medium, high, critical]}}
  question:   {primitive: item,   tags: [question], container: false}
  note:       {primitive: note,   tags: []}
  convention: {primitive: note,   tags: [convention]}
  code:       {primitive: note,   tags: [code], fields: {kind: [file, module, class, function, method]}, template: templates/code.md}
  decision:   {primitive: record, tags: [decision]}
  review:     {primitive: record, tags: [review]}
  event:      {primitive: record, tags: [event]}
  result:     {primitive: record, tags: [result], required: [workflow_name], template: templates/result.md}
  review-result: {primitive: record, tags: [review], required: [workflow_name], template: templates/review-result.md}
  scene-result: {primitive: record, tags: [result], required: [workflow_name], template: templates/scene-result.md}
  scene-review: {primitive: record, tags: [review], required: [workflow_name], template: templates/scene-review.md}
  shot-result: {primitive: record, tags: [result], required: [workflow_name], template: templates/shot-result.md}
  shot-review: {primitive: record, tags: [review], required: [workflow_name], template: templates/shot-review.md}
  asset-result: {primitive: record, tags: [result], required: [workflow_name], template: templates/asset-result.md}
  asset-review: {primitive: record, tags: [review], required: [workflow_name], template: templates/asset-review.md}
  check:      {primitive: check,  tags: []}
  charter:    {primitive: policy, tags: [], template: templates/charter.md}
  vision:     {primitive: note,   tags: []}
  wont:       {primitive: note,   tags: []}
  skill:      {primitive: note,   tags: []}
  cto:        {primitive: actor,  tags: []}
  profile:    {primitive: actor,  tags: []}
  fix:        {primitive: item,   tags: [], container: false}
policy: {stuck_hours: 24, measurement_min_runs: 10, code_graph: none}
results:
  produce:
    preset: result
    sections: [Summary, Creative intent, Outputs and assets, Continuity, Evidence, Next steps]
  review:
    preset: review-result
    sections: [Summary, Creative assessment, Output assessment, Continuity, Evidence, Verdict]
operating:
  version: 1
  unit: shot
  hierarchy:
    - preset: scene
      order: sequence
      required: true
  focus:
    preset: scene
    category: active
    order: sequence
    resolve: unique
  queue:
    presets: [shot]
    require: transition
    focus: priority
  progress:
    group: scene
    of: [shot]
    complete:
      states: [approved]
  execution:
    actions: [render]
actions:
  start-scene:
    "on": scene
    from: [draft]
    tool: change move
    args: {slug: "{item}", status: storyboard, expect: "{etag}"}
    use_when: "a scene is ready to work on"
  storyboard:
    "on": shot
    from: [draft]
    tool: change move
    args: {slug: "{item}", status: storyboard, expect: "{etag}"}
    use_when: "a shot needs a storyboard before generation"
  generate:
    "on": shot
    from: [storyboard]
    tool: change move
    args: {slug: "{item}", status: generating, expect: "{etag}"}
    use_when: "a storyboarded shot is ready to generate"
  approve:
    "on": shot
    from: [review]
    tool: change move
    args: {slug: "{item}", status: approved, expect: "{etag}"}
    use_when: "a reviewed shot is accepted"
  publish:
    "on": shot
    from: [approved]
    tool: change move
    args: {slug: "{item}", status: published, expect: "{etag}"}
    use_when: "an approved shot is released"
  render:
    "on": shot
    from: [approved]
    tool: next
    args: {item: "{item}"}
    use_when: "an approved shot needs its final render; the renderer reports each attempt as an execution record on the shot"
    version: 1
