[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "context-rail"
version = "3.3.1"
description = "An agentic project workspace: files are the truth, agents work through one write path"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "mcp>=2.3.0,<3"]
keywords = ["agents", "context", "project-management", "markdown", "sqlite", "workflow", "mcp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
rail = "context_rail.cli:main"
ctx-rail = "context_rail.cli:main"

[project.urls]
Repository = "https://github.com/nguyenhoanhson797/Context-Rail"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_rail = ["packs/**/*", "ui/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
timeout = 300
timeout_method = "thread"
markers = [
    "slow: tests that take many seconds (excluded from the default lane)",
    "perf: speed-budget tests (run serially, never with xdist)",
    "codegraph_live: tests that need a real Graphify or GitNexus install",
]
addopts = "-q -m 'not slow'"
